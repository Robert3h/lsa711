    <h1>五層除錯練習</h1>
    <p class="sub">想一件最近卡住的小事，跟著五層一層一層往下看。你寫的內容不會送出、也不會儲存，關掉分頁就消失。這不是心理諮商，只是一組可以帶走的提問。</p>
  </header>
  <div class="game" data-game="five-layers">
    <noscript><p>這個小遊戲需要開啟 JavaScript 才能玩。</p></noscript>
  </div>
</div>
<script id="game-data" type="application/json">{"layers": [{"id": "L1", "name": "事件層 Event", "view": "julian", "prompt": "發生了什麼事？只寫看得到、聽得到的事實，像監視器會拍到的那樣。", "example": "例：會議上，主管當著大家的面，請我重做那份報表。"}, {"id": "L2", "name": "情緒層 Emotion", "view": "ginni", "prompt": "那一刻，你感覺到什麼？不用合理，也不用好聽。", "example": "例：丟臉、委屈，還有一點生氣。"}, {"id": "L3", "name": "模式層 Pattern", "view": "julian", "prompt": "這種感覺以前出現過嗎？通常在什麼情況下出現？", "example": "例：每次努力被當眾否定，我就會很想立刻證明自己。"}, {"id": "L4", "name": "系統層 System", "view": "julian", "prompt": "你在保護什麼，或在追求什麼？是哪一條「原廠設定」被觸發了？", "example": "例：我很在意「做事可靠」這個形象。"}, {"id": "L5", "name": "元認知層 Meta-cognition", "view": "ginni", "prompt": "退後一步看：你剛剛的解讀，有沒有可能只是其中一種版本？", "example": "例：也許主管只是趕時間，不是在否定我。"}]}</script>
